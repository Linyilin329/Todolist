<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办事项 · Todo List</title>
<style>
  :root {
    --bg: #f2f4fb;
    --card: #ffffff;
    --text: #1f2430;
    --text-soft: #6b7280;
    --border: #e6e8f0;
    --primary: #5b6cff;
    --primary-dark: #4453e0;
    --primary-soft: #eceefe;
    --danger: #ef4444;
    --danger-soft: #fef0f0;
    --success: #16a34a;
    --warning: #f59e0b;
    --shadow: 0 10px 30px rgba(40, 48, 99, 0.10);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #14161f;
    --card: #1e212d;
    --text: #e8eaf2;
    --text-soft: #9aa1b5;
    --border: #2c3040;
    --primary: #7b8cff;
    --primary-dark: #5b6cff;
    --primary-soft: #262b45;
    --danger: #f87171;
    --danger-soft: #3a2326;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    transition: background .3s, color .3s;
  }

  .app {
    width: 100%;
    max-width: 620px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--primary), #9a6bff);
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: #fff;
    box-shadow: var(--shadow);
  }
  .header .date {
    font-size: 13px;
    color: var(--text-soft);
    margin-top: 4px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-soft);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .2s;
  }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* ---------- Progress ---------- */
  .progress-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .track { stroke: var(--border); }
  .progress-ring .bar {
    stroke: var(--primary);
    stroke-linecap: round;
    transition: stroke-dashoffset .5s ease;
  }
  .progress-ring .pct {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .progress-info .num { font-size: 16px; font-weight: 700; }
  .progress-info .tip { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

  /* ---------- Input ---------- */
  .input-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .input-card input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
  }
  .input-card input[type="text"]::placeholder { color: var(--text-soft); }
  .input-card select {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    padding: 0 8px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .add-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .2s, transform .1s;
  }
  .add-btn:hover { background: var(--primary-dark); }
  .add-btn:active { transform: scale(.96); }

  /* ---------- Filters ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filters { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
  .filter-btn {
    border: none;
    background: transparent;
    color: var(--text-soft);
    padding: 7px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .filter-btn.active { background: var(--primary-soft); color: var(--primary); }
  .clear-btn {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .clear-btn:hover { color: var(--danger); background: var(--danger-soft); }

  /* ---------- List ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .item.removing { animation: slideOut .2s ease forwards; }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(30px); }
  }
  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    transition: all .2s;
  }
  .check:hover { border-color: var(--primary); }
  .item.done .check { background: var(--success); border-color: var(--success); }
  .check svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .item.done .check svg { opacity: 1; }

  .item-body { flex: 1; min-width: 0; }
  .item-text {
    font-size: 15px;
    word-break: break-word;
    cursor: text;
  }
  .item.done .item-text { color: var(--text-soft); text-decoration: line-through; }
  .item-text-edit {
    width: 100%;
    font-size: 15px;
    border: 1px solid var(--primary);
    border-radius: 8px;
    padding: 4px 8px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  .item-meta { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .tag.high { color: var(--danger); background: var(--danger-soft); }
  .tag.medium { color: #b45309; background: #fef6e4; }
  .tag.low { color: var(--success); background: #eafaf0; }
  [data-theme="dark"] .tag.medium { color: #fbbf24; background: #3a3320; }
  [data-theme="dark"] .tag.low { color: #4ade80; background: #1d3326; }
  .item-time { font-size: 11px; color: var(--text-soft); }

  .item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .item:hover .item-actions { opacity: 1; }
  .act {
    width: 32px; height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-soft);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .15s;
  }
  .act:hover { background: var(--primary-soft); color: var(--primary); }
  .act.del:hover { background: var(--danger-soft); color: var(--danger); }

  /* ---------- Empty ---------- */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-soft);
  }
  .empty .icon {
    width: 72px; height: 72px;
    margin: 0 auto 14px;
    background: var(--primary-soft);
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .empty p { font-size: 14px; }

  footer {
    text-align: center;
    margin-top: 26px;
    font-size: 12px;
    color: var(--text-soft);
  }

  @media (max-width: 480px) {
    .input-card { flex-wrap: wrap; }
    .input-card input[type="text"] { flex-basis: 100%; }
    .add-btn { flex: 1; justify-content: center; padding: 10px; }
    .item-actions { opacity: 1; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>
        <span class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </span>
        我的待办
      </h1>
      <div class="date" id="today"></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色">
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-card">
    <div class="progress-ring">
      <svg width="56" height="56">
        <circle class="track" cx="28" cy="28" r="24" fill="none" stroke-width="6"/>
        <circle class="bar" id="ringBar" cx="28" cy="28" r="24" fill="none" stroke-width="6"
                stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
      </svg>
      <div class="pct" id="ringPct">0%</div>
    </div>
    <div class="progress-info">
      <div class="num" id="progressNum">还没有任务</div>
      <div class="tip" id="progressTip">在下方添加你的第一个待办事项吧</div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-card">
    <input type="text" id="taskInput" placeholder="添加一个新任务，回车快速创建…" maxlength="120">
    <select id="prioritySelect" title="优先级">
      <option value="high">高优先级</option>
      <option value="medium" selected>中优先级</option>
      <option value="low">低优先级</option>
    </select>
    <button class="add-btn" id="addBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      添加
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">进行中</button>
      <button class="filter-btn" data-filter="done">已完成</button>
    </div>
    <button class="clear-btn" id="clearDoneBtn">清除已完成</button>
  </div>

  <!-- List -->
  <div class="list" id="list"></div>

  <footer>数据自动保存在本地浏览器中 · Todo List</footer>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todo-list-v1";
  var THEME_KEY = "todo-theme";

  var state = {
    tasks: [],
    filter: "all"
  };

  /* ---------- Storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.tasks = JSON.parse(raw) || [];
    } catch (e) { state.tasks = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); } catch (e) {}
  }

  /* ---------- Helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatTime(ts) {
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var pad = function (n) { return n < 10 ? "0" + n : n; };
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (sameDay) return "今天 " + hm;
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  }

  var priorityText = { high: "高", medium: "中", low: "低" };

  /* ---------- DOM refs ---------- */
  var listEl = document.getElementById("list");
  var inputEl = document.getElementById("taskInput");
  var priorityEl = document.getElementById("prioritySelect");

  /* ---------- Render ---------- */
  function visibleTasks() {
    var tasks = state.tasks.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var rank = { high: 0, medium: 1, low: 2 };
      if (rank[a.priority] !== rank[b.priority]) return rank[a.priority] - rank[b.priority];
      return b.createdAt - a.createdAt;
    });
    if (state.filter === "active") return tasks.filter(function (t) { return !t.done; });
    if (state.filter === "done") return tasks.filter(function (t) { return t.done; });
    return tasks;
  }

  function render() {
    var tasks = visibleTasks();
    listEl.innerHTML = "";

    if (state.tasks.length === 0) {
      listEl.innerHTML =
        '<div class="empty"><div class="icon">' +
        '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5b6cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
        "</div><p>暂无任务，添加一个开始安排你的一天 ✨</p></div>";
    } else if (tasks.length === 0) {
      var msg = state.filter === "done" ? "还没有完成的任务" : "太棒了，所有任务都已完成 🎉";
      listEl.innerHTML = '<div class="empty"><p>' + msg + "</p></div>";
    } else {
      tasks.forEach(function (t) { listEl.appendChild(renderItem(t)); });
    }
    renderProgress();
  }

  function renderItem(t) {
    var item = document.createElement("div");
    item.className = "item" + (t.done ? " done" : "");
    item.dataset.id = t.id;
    item.innerHTML =
      '<div class="check" data-act="toggle" title="标记完成">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
      "</div>" +
      '<div class="item-body">' +
        '<div class="item-text" data-act="edit">' + escapeHtml(t.text) + "</div>" +
        '<div class="item-meta">' +
          '<span class="tag ' + t.priority + '">' + priorityText[t.priority] + "优先级</span>" +
          '<span class="item-time">' + formatTime(t.createdAt) + "</span>" +
        "</div>" +
      "</div>" +
      '<div class="item-actions">' +
        '<button class="act" data-act="edit" title="编辑">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
        "</button>" +
        '<button class="act del" data-act="delete" title="删除">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
        "</button>" +
      "</div>";
    return item;
  }

  function renderProgress() {
    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    var pct = total === 0 ? 0 : Math.round(done / total * 100);

    var CIRC = 2 * Math.PI * 24; // 150.8
    document.getElementById("ringBar").style.strokeDasharray = CIRC;
    document.getElementById("ringBar").style.strokeDashoffset = CIRC * (1 - pct / 100);
    document.getElementById("ringPct").textContent = pct + "%";

    var numEl = document.getElementById("progressNum");
    var tipEl = document.getElementById("progressTip");
    if (total === 0) {
      numEl.textContent = "还没有任务";
      tipEl.textContent = "在下方添加你的第一个待办事项吧";
    } else {
      numEl.textContent = "已完成 " + done + " / " + total + " 项";
      var left = total - done;
      tipEl.textContent = left === 0 ? "全部完成，给自己点个赞吧 🎉" : "还有 " + left + " 项待完成，加油！";
    }
  }

  /* ---------- Actions ---------- */
  function addTask() {
    var text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    state.tasks.push({
      id: uid(),
      text: text,
      done: false,
      priority: priorityEl.value,
      createdAt: Date.now()
    });
    inputEl.value = "";
    save();
    render();
    inputEl.focus();
  }

  function toggleTask(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    var el = listEl.querySelector('.item[data-id="' + id + '"]');
    if (el) {
      el.classList.add("removing");
      setTimeout(function () {
        state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
        save(); render();
      }, 180);
    }
  }

  function startEdit(id, target) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var textEl = target.closest(".item-body").querySelector(".item-text");
    var input = document.createElement("input");
    input.type = "text";
    input.className = "item-text-edit";
    input.value = t.text;
    input.maxLength = 120;
    textEl.replaceWith(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    var finished = false;
    function commit(saveChange) {
      if (finished) return;
      finished = true;
      if (saveChange) {
        var v = input.value.trim();
        if (v) { t.text = v; save(); }
      }
      render();
    }
    input.addEventListener("blur", function () { commit(true); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); commit(true); }
      if (e.key === "Escape") { commit(false); }
    });
  }

  /* ---------- Events ---------- */
  document.getElementById("addBtn").addEventListener("click", addTask);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addTask(); }
  });

  listEl.addEventListener("click", function (e) {
    var actEl = e.target.closest("[data-act]");
    if (!actEl) return;
    var itemEl = e.target.closest(".item");
    if (!itemEl) return;
    var id = itemEl.dataset.id;
    var act = actEl.dataset.act;
    if (act === "toggle") toggleTask(id);
    else if (act === "delete") deleteTask(id);
    else if (act === "edit") startEdit(id, actEl);
  });

  document.querySelectorAll(".filter-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".filter-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById("clearDoneBtn").addEventListener("click", function () {
    var count = state.tasks.filter(function (t) { return t.done; }).length;
    if (count === 0) return;
    if (confirm("确定要清除 " + count + " 项已完成的任务吗？")) {
      state.tasks = state.tasks.filter(function (t) { return !t.done; });
      save(); render();
    }
  });

  /* ---------- Theme ---------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("iconMoon").style.display = theme === "dark" ? "none" : "block";
    document.getElementById("iconSun").style.display = theme === "dark" ? "block" : "none";
  }
  var savedTheme = localStorage.getItem(THEME_KEY);
  if (!savedTheme) {
    savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(savedTheme);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  /* ---------- Date ---------- */
  var weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  var now = new Date();
  document.getElementById("today").textContent =
    now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 " + weekDays[now.getDay()];

  /* ---------- Init ---------- */
  load();

  // 首次打开时给几条示例任务，便于预览效果
  if (state.tasks.length === 0 && !localStorage.getItem("todo-seeded")) {
    localStorage.setItem("todo-seeded", "1");
    var base = Date.now();
    state.tasks = [
